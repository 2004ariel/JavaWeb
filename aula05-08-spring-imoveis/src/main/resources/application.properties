spring.application.name=demo

#configuracao banco de dados
spring.datasource.url=jdbc:mysql://localhost:3306/restaurante
spring.datasource.username=root
spring.datasource.password=
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

#JPA /hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

#upload de arquivos (fotos dos imóveis)
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

#email (Mailgun) - credenciais ficam em mail.properties (fora do git)
spring.config.import=optional:file:./mail.properties
spring.mail.host=smtp.mailgun.org
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
#loga a conversa SMTP (inclui o AUTH em base64) - desligar depois de testar
spring.mail.properties.mail.debug=true

#JWT - em produção definir a variável de ambiente JWT_SECRET (mínimo 32 caracteres)
jwt.secret=${JWT_SECRET:chave-so-pra-dev-troque-em-producao-123456}
jwt.expiration-ms=3600000
